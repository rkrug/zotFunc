                    "itemType": "journalArticle",
                    "title": "What about the negatives? An integrated framework for revealing diverse values of nature and its conservation",
                    "creators": [
                        {
                            "creatorType": "author",
                            "firstName": "V. J.",
                            "lastName": "Oostvogels"
                        },
                        {
