                            "lastName": "Ripoll<U+2010>Bosch"
                        }
                    ],
                    "abstractNote": "Abstract\n            \n              \n                \n                  Taking into account the perspectives of local stakeholders is essential for just and effective biodiversity conservation. Plural valuation, making visible the diverse values people hold in relation to nature, has emerged as a key approach towards better inclusion of stakeholders' perspectives.\n                \n                \n                  So far, plural valuation has mainly focused on positive values, leaving equally important negative values underexposed. To address this, a concrete proposal has been presented to also consider <U+2018>disvalues<U+2019>. However, accessible frameworks to help practitioners apply this concept are arguably still lacking.\n                \n                \n                  To address this gap, we here propose the <U+2018>Integrated Nature Futures Framework<U+2019> (I<U+2010>NFF), where <U+2018>integrated<U+2019> indicates joint consideration of positive and negative values. The I<U+2010>NFF draws on the popular Nature Futures Framework (NFF) to develop disvalue thinking in a more accessible form.\n                \n                \n                  The I<U+2010>NFF considers three perspectives (<U+2018>nature<U+2019>, <U+2018>society<U+2019> and <U+2018>culture<U+2019>), based on which something can be placed on a spectrum from positive (<U+2018>for nature<U+2019>, <U+2018>for society<U+2019> and <U+2018>as culture<U+2019>) to negative (<U+2018>against nature<U+2019>, <U+2018>against society<U+2019> and <U+2018>in conflict with culture<U+2019>), and can be represented as two mirrored triangles.\n                \n                \n                  Using empirical data, we illustrate various purposes for which the I<U+2010>NFF can be used: to inventory nature<U+2010>related topics <U+2018>at play<U+2019> in a given context, to depict how people frame their overall relationship with nature or to depict how people frame specific issues. This demonstrates how the I<U+2010>NFF helps reveal value pluralism and trade<U+2010>offs, capture the reciprocity of human<U+2013>nature relationships and identify where perspectives differ and share common ground.\n                \n                \n                  We close by discussing how the I<U+2010>NFF can enhance the inclusion of stakeholder voices in biodiversity conservation, which is indispensable for a more nature<U+2010> and people<U+2010>positive future.\n                \n              \n            \n            \n              Read the free\n              Plain Language Summary\n              for this article on the Journal blog.\n            \n          , \n            \n              Read the free\n              Plain Language Summary\n              for this article on the Journal blog.",
