                "data": {
                    "id": 2603670,
                    "version": 73,
                    "name": "IPCC-IPBES",
                    "owner": 5760254,
                    "type": "PublicOpen",
                    "description": "<p><span lang=\"en-us\" xml:lang=\"en-us\">In December 2020, 50 of the world<U+2019>s leading biodiversity and climate experts, selected by a 12-person Scientific Steering Committee assembled by IPBES and IPCC, participated in a four-day virtual workshop to examine the synergies and trade-offs </span><span lang=\"en-us\" xml:lang=\"en-us\">between biodiversity protection and climate change mitigation and adaptation. This represents the first-ever collaboration between the two intergovernmental science-policy bodies. The IPBES-IPCC co-sponsored workshop report on biodiversity and climate change, available below, was launched on 10 June 2021 at a virtual media conference.</span>More details available on <a title=\"IPBES-IPCC Co-Sponsored Workshop Report on Biodiversity and Climate Change\" href=\"https://ipbes.net/node/36668\" rel=\"nofollow\">https://ipbes.net/node/36668</a></p>",
                    "url": "https://ipbes.net/events/ipbes-ipcc-co-sponsored-workshop-report-biodiversity-and-climate-change",
