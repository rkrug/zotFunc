                    "name": "IPBES ILK",
                    "owner": 5760254,
                    "type": "PublicClosed",
                    "description": "<p><strong>Library of the references identified as resources for the past and ongoing IPBES assessments.</strong></p>\n<p>This library contains the references and resources contributed during calls for contributions for Indigenous and local knowledge (ILK), references cited in previous approved IPBES reports as well as references identified as resources by the task force and technical support unit on ILK.</p>\n<p>Tags are being used to indicate how a reference has been collected and/or used: C refers to calls for contribution (the year and assessment abbreviation indicate when the call for contributions was held, and for which assessment references were requested specifically); A refers to a citation in an assessment. </p>\n<p>For enquiries and/or suggestions, please contact the IPBES technical support unit on ILK (<a href=\"mailto:p.bates@unesco.org\"> p.bates@unesco.org).</a></p>",
                    "url": "https://www.ipbes.net/indigenous-local-knowledge",
